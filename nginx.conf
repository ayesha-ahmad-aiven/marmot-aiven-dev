# Runs as the unprivileged marmot user, so every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    client_max_body_size 50m;

    upstream marmot {
        server 127.0.0.1:8081;
    }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;

        # go-sdk rejects MCP requests that arrive on loopback with a
        # non-loopback Host header. Only this path gets the rewrite.
        location /api/v1/mcp {
            proxy_set_header Host localhost;
            proxy_buffering off;
            proxy_pass http://marmot;
        }

        location / {
            proxy_set_header Host $host;
            proxy_pass http://marmot;
        }
    }
}
